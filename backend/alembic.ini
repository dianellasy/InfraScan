# InfraScan Alembic configuration.
#
# Do NOT set `sqlalchemy.url` or hardcode database credentials in this file.
# `alembic/env.py` reads the connection URL from the `DATABASE_URL` environment
# variable at runtime and normalizes it to the installed `psycopg` driver.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
